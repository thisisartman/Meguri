name: Correction
description: Wrong location, name, picture or details
title: "[Correction] "
labels: ["catalogue", "correction", "needs confirmation"]
body:
  - type: input
    id: item
    attributes:
      label: Item
      placeholder: Name or code, as in Meguri
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What should it be
      placeholder: For example, the correct location or name
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      placeholder: Date you saw it, or a link
