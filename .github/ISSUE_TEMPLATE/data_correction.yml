name: Correct something
description: A card, stamp, station or place in Meguri has the wrong details
title: "[Correction] "
labels: ["data", "correction", "needs confirmation"]
body:
  - type: markdown
    attributes:
      value: |
        Something missing from Meguri? Use **Add a place or a collectible** instead. Sold out, new hours or no longer handed out? Use **Report availability**.
  - type: input
    id: item
    attributes:
      label: Which item?
      description: Its name as shown in Meguri, and its code if it has one.
      placeholder: Nagaoka · Kawagutchi (15-202-C001)
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What's wrong?
      options:
        - It's in the wrong place on the map
        - The name is wrong
        - The picture is wrong
        - The address or phone number is wrong
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should it be?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: How do you know?
      description: A link to an official page or notice, or the date you saw it in person.
