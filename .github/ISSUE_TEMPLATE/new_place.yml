name: Add something
description: A new place, or a new collectible at a place
title: "[Add] "
labels: ["catalogue", "add", "needs confirmation"]
body:
  - type: dropdown
    id: what
    attributes:
      label: What
      options:
        - New place
        - New collectible
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      multiple: true
      options:
        - Manhole card
        - Station stamp
        - Ekitag
        - Goshuin
        - Dam card
        - Roadside station
        - Museum stamp
        - Other
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: 八海山ロープウェー (Hakkaisan Ropeway)
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      placeholder: Address or map link
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      placeholder: Counter, hours, price, closed days. Photos welcome.
  - type: input
    id: source
    attributes:
      label: Source
      placeholder: Date you saw it, or a link
    validations:
      required: true
