name: Bug
description: Something doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: |
        1. Open Nearby
        2. Tap ...
        Expected ..., but ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Meguri version and phone
      placeholder: 0.5.0, Galaxy S23, Android 15
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or log
      placeholder: "Optional. Log: Settings › Help and about › Logs › Export"
