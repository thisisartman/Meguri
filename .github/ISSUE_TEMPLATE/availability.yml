name: Availability
description: Sold out, back, new hours, moved or gone
title: "[Availability] "
labels: ["catalogue", "availability", "needs confirmation"]
body:
  - type: input
    id: item
    attributes:
      label: Item
      placeholder: Name or code, as in Meguri
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Now
      options:
        - Sold out
        - Back
        - New hours
        - Moved
        - Gone
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      placeholder: New hours, new place, anything else
  - type: input
    id: source
    attributes:
      label: Source
      placeholder: Date you saw it, or a link
    validations:
      required: true
