name: Feature request
description: Suggest something Meguri could do
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues, open and closed, and this idea is new
          required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: Describe the feature, and where in the app it would be.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: The moment when you would use it (at a counter, on a train, planning a trip ...).
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Other apps that do it well, sketches, screenshots.
